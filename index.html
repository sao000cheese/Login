<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Green</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080a08;
      color: #eee;
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 26px;
      background: #111511;
      border: 1px solid #435536;
      border-radius: 18px;
      box-shadow: 0 0 35px #526b3020;
    }

    h1 {
      color: #91a96b;
      text-align: center;
    }

    p {
      color: #a6ada0;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 24px 0 8px;
      color: #d9e0d2;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #435536;
      border-radius: 9px;
      background: #090c09;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #91a96b;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #667d45;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Dark Green</h1>

    <p>کد خود را وارد کنید.</p>

    <form id="codeForm">
      <label for="code">کد را وارد کنید</label>

      <input
        id="code"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placehold="کد"
        autocomplete="off"
        required
      >

      <button id="submitButton" type="submit">
        ثبت کد
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://hdsktnfshmfvvmwtjsli.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_2XeJnIvnCBtzKtWKDuLEpA_LOx14DEL';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('codeForm');
    const input = document.getElementById('code');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const code = input.value.trim();

      if (code !== '123456') {
        message.textContent = 'کد معتبر نیست.';
        return;
      }

      button.disabled = true;
      button.textContent = 'در حال ذخیره...';
      message.textContent = '';

      try {
        const { error } = await supabase
          .from('demo_code_entries')
          .insert({ demo_code: '123456' });

        if (error) {
          throw error;
        }

        message.textContent =
          'کد با موفقیت ثبت شد!';

        input.value = '';
      } catch (error) {
        console.error(error);

        message.textContent =
          'ذخیره انجام نشد. تنظیمات Supabase را بررسی کن.';
      } finally {
        button.disabled = false;
        button.textContent = 'ثبت کد';
      }
    });
  </script>
</body>
</html>
