<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Vault</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080b09;
      color: #f1f5f1;
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 30px 24px;
      background: #111713;
      border: 1px solid #29382d;
      border-radius: 18px;
      box-shadow: 0 15px 45px #0008;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: #263b2b;
      color: #a5d6a7;
      font-size: 27px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 25px;
    }

    .description {
      margin: 0 0 28px;
      text-align: center;
      color: #929d94;
      font-size: 13px;
      line-height: 1.9;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #c6d1c8;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #35473a;
      border-radius: 10px;
      outline: none;
      background: #0b100c;
      color: white;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #78a77e;
      box-shadow: 0 0 0 3px #78a77e20;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #789b71;
      color: #071008;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #91b58a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 25px;
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #647067;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">⌘</div>

    <h1>Code Vault</h1>

    <p class="description">
      محیط ذخیره کدها
    </p>

    <form id="codeForm">
      <label for="code">کد خودت را وارد کن</label>

      <input
        id="code"
        type="text"
        maxlength="100"
        placeholder="کد..."
        autocomplete="off"
        required
      >

      <button id="submitButton" type="submit">
        ذخیره کد
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      Code Vault · Demo
    </div>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    // اطلاعات اتصال پروژه Supabase خودت
    const SUPABASE_URL = 'https://hdsktnfshmfvvmwtjsli.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2XeJnIvnCBtzKtWKDuLEpA_LOx14DEL';';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('codeForm');
    const input = document.getElementById('code');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const code = input.value.trim();

      if (!code) {
        message.textContent = 'لطفاً یک کد وارد کن.';
        return;
      }

      button.disabled = true;
      button.textContent = 'در حال ذخیره...';
      message.textContent = '';

      try {
        const { error } = await supabase
          .from('demo_code_entries')
          .insert({ demo_code: code });

        if (error) {
          throw error;
        }

        message.textContent = 'کد آزمایشی ذخیره شد!';
        input.value = '';
      } catch (error) {
        console.error('Supabase error:', error);
        message.textContent =
          'خطا در ذخیره‌سازی: ' + error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'ذخیره کد';
      }
    });
  </script>
</body>
</html>
